# =============================================================================
# alembic.ini — Alembic Configuration for Ajit-backprop-test (Python 3.13)
# =============================================================================
#
# This file is the canonical Alembic configuration for the Python 3
# implementation of the Ajit-backprop-test project. It replaces the
# JavaScript/Node-based migration tooling that the upstream user setup
# instructions originally invoked via `npm run migrate --db=${DB_HOST}` —
# under the refactor governed by the project's Agent Action Plan (AAP):
#
#   * AAP §0.5.1 — `alembic.ini` is enumerated as a CREATE target in the
#                  unconditional baseline refactor.
#   * AAP §0.6.2 — Alembic 1.14.x replaces `sequelize-cli` / `knex migrate`
#                  / `prisma migrate` as the migration tool.
#   * AAP §0.7.3 — Configuration loading is centralized; environment-
#                  variable reads (such as `DB_HOST`) live in
#                  `src/ajit_backprop/db/migrations/env.py`, NOT in this
#                  static configuration file.
#   * AAP §0.8.2 — Idempotent migrations (Alembic handles natively) and
#                  type discipline.
#   * AAP §0.8.3 — Secrets are NEVER hard-coded; `DB_HOST` and `API_KEY`
#                  are read from `os.environ` only.
#
# This file is read by:
#   * `alembic upgrade head`              (CLI invocation)
#   * `alembic revision --autogenerate`   (developer migration generation)
#   * `alembic check`                     (CI sanity check)
#   * `python scripts/migrate.py --db=${DB_HOST}` (the project-supplied
#                                          wrapper that mirrors the user's
#                                          original `npm run migrate` UX)
#
# Percent-sign escaping discipline:
#
#   * The `[alembic]` section is read by Alembic's own
#     `configparser.ConfigParser` instance, which uses BasicInterpolation.
#     Therefore the `file_template` value uses *doubled* percent signs
#     (`%%(year)d`) so that BasicInterpolation produces the literal string
#     `%(year)d` that Alembic then formats internally.
#
#   * The `[formatter_*]` sections are read by Python's stdlib
#     `logging.config.fileConfig`, which fetches `format` and `datefmt`
#     with `raw=True`. Therefore those fields use *single* percent signs
#     (`%(levelname)s`, `%H:%M:%S`) — doubling them here would produce
#     literal `%(levelname)s` strings in log output rather than formatted
#     log records. This is the canonical Alembic convention as emitted by
#     `alembic init` on Alembic 1.14.x.
#
# Security:
#
#   * `sqlalchemy.url` is intentionally left BLANK in this file. The
#     actual SQLAlchemy URL is resolved at runtime by `env.py` from the
#     `DB_HOST` environment variable (or the `--db` CLI flag in
#     `scripts/migrate.py`). This file MUST NEVER contain credentials.
#     If a contributor accidentally fills in a real connection string
#     here, treat it as a security incident and rotate any leaked
#     credentials immediately.
# =============================================================================


# -----------------------------------------------------------------------------
# [alembic] — Core Alembic configuration
# -----------------------------------------------------------------------------
# This section drives Alembic's runtime behaviour: where migration scripts
# live, how filenames are generated, the timezone used for revision
# timestamps, and the (deliberately blank) database URL.
[alembic]

# Path to the migration scripts directory, relative to this file's location.
# Per AAP §0.4.1 the canonical Python package is `src/ajit_backprop`, and
# database migrations live under `src/ajit_backprop/db/migrations` per
# AAP §0.5.1. Forward slashes are required even on Windows so the path
# remains OS-agnostic.
script_location = src/ajit_backprop/db/migrations

# Template used to generate migration file names. The default Alembic
# template is `%%(rev)s_%%(slug)s`; here we prepend a UTC timestamp so
# that migrations sort chronologically when listed by `ls`. Doubled
# percent signs escape configparser's BasicInterpolation — Alembic
# receives the literal `%(year)d_%(month).2d_...` template.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Path that Alembic prepends to `sys.path` before importing `env.py` and
# any application modules referenced from there. Setting this to `.`
# (the project root) lets `env.py` perform `from ajit_backprop import ...`
# imports without further sys.path manipulation, since the project uses
# the `src/` layout and `pip install -e .` makes `ajit_backprop`
# importable from the repository root during development.
prepend_sys_path = .

# Timezone applied to `%(year)d`, `%(month)d`, `%(day)d`, `%(hour)d`,
# `%(minute)d` substitutions in `file_template` and to any timestamp
# rendering inside the migration scripts. UTC is mandated for
# reproducibility — developers in different timezones produce filenames
# that sort identically. Python 3.13's stdlib `zoneinfo` resolves the
# value, so no extra dependency is required.
timezone = UTC

# Maximum length of the `slug` component (derived from the `--message`
# argument to `alembic revision`). Forty characters keeps filenames
# under typical filesystem limits while preserving meaning.
truncate_slug_length = 40

# Version path separator. `os` selects `os.pathsep` (`:` on POSIX,
# `;` on Windows), which is the Alembic 1.10+ recommended default.
# This matters only if `version_locations` lists multiple directories;
# this project keeps a single directory but the explicit setting
# documents the convention and silences the legacy-fallback warning.
version_path_separator = os

# Output encoding for files written from `script.py.mako`. UTF-8 keeps
# migration scripts portable across operating systems and avoids the
# Windows-default `cp1252` mojibake hazard.
output_encoding = utf-8

# Database connection URL. INTENTIONALLY LEFT BLANK — see the security
# notes at the top of this file. The actual URL is resolved at runtime
# by `src/ajit_backprop/db/migrations/env.py` from `os.environ["DB_HOST"]`
# (or via Alembic's `-x db_url=...` for ad-hoc invocations).
#
# Format expected by `env.py` (mirroring `.env.example`):
#   postgresql+psycopg://USER:PASSWORD@HOST:PORT/DATABASE
sqlalchemy.url =


# -----------------------------------------------------------------------------
# [post_write_hooks] — Auto-format generated migration scripts
# -----------------------------------------------------------------------------
# Alembic invokes these hooks immediately after `alembic revision` (or
# `alembic revision --autogenerate`) writes a new migration script to
# disk. Running `black` and `ruff format` ensures every generated
# migration matches the project's formatting conventions (line-length
# 100, py313 target — defined in `pyproject.toml` `[tool.black]` and
# `[tool.ruff]`), so contributors do not have to remember to run the
# formatters by hand. Both hooks read their settings from
# `pyproject.toml`; no additional CLI options are needed here.
#
# `console_scripts` is the recommended hook type for Python tooling
# installed in the active virtualenv — Alembic uses Python's
# `pkg_resources` / `importlib.metadata` to locate the entrypoint,
# which is faster and more portable than the `exec` runner.
[post_write_hooks]
hooks = black, ruff

black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


# -----------------------------------------------------------------------------
# Logging configuration (consumed by `logging.config.fileConfig`)
# -----------------------------------------------------------------------------
# These sections are NOT consumed by Alembic's own configparser instance;
# they are passed to Python's stdlib `logging.config.fileConfig`, which
# fetches `format` and `datefmt` with `raw=True`. Therefore single
# percent signs (`%(name)s`, `%H:%M:%S`) are correct here — doubling
# them would print literal `%(name)s` strings in log records.
# -----------------------------------------------------------------------------

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

# Root logger — catches anything not handled by the named loggers below.
# WARNING is the conservative default; CI and developers can override
# via `LOGGING_LEVEL` env var or by editing this file locally.
[logger_root]
level = WARNING
handlers = console
qualname =

# SQLAlchemy engine logger. WARNING avoids dumping every emitted SQL
# statement at INFO level, which is noisy and may reveal sensitive
# data in logs (table names, query parameters). Switch to INFO for
# local debugging only.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# Alembic's own logger — INFO so that `upgrade`, `downgrade`, and
# `revision` operations emit one-line progress messages by default.
# This is the conventional Alembic level and matches the output the
# `make migrate` target expects to see.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Console handler — writes to stderr (not stdout) so that piping
# `alembic upgrade head` output through `tee` or redirecting stdout
# does not lose the log lines. Level NOTSET defers level filtering
# entirely to the per-logger levels declared above.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Concise log format suitable for migration-script output:
#   <LEVEL_5char> [<logger_name>] <message>
# `levelname-5.5s` truncates and right-pads the level name to exactly
# five characters so that `INFO `, `WARN `, `ERROR`, and `DEBUG`
# columnize cleanly. The `datefmt` is not referenced by `format`
# (`%(asctime)s` is absent), but is set defensively so that any
# child logger that opts into `%(asctime)s` produces consistent
# `HH:MM:SS` timestamps in UTC.
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

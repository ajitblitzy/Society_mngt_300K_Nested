# pyproject.toml -- planned JavaScript/Node.js -> Python migration target.
# Created by the setup/baseline step. Application source does not exist yet
# (migration is future work per the AAP blocking precondition); this file
# establishes PEP 621 metadata and the code-quality toolchain mandated by the
# user rule Ajit_refactor_Simple ("optimize code quality and performance").

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ajit-backprop-test"
version = "0.0.0"
description = "Planned JavaScript/Node.js to Python migration target. See README.md for the blocking precondition."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.1",
    "pydantic==2.10.4",
    "pydantic-settings>=2.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "uvicorn==0.34.0",
    "httpx>=0.28",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff",
    "black",
    "isort",
]

# src-layout package discovery. The src/ tree is created during migration;
# until then discovery simply finds no packages (no error).
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]